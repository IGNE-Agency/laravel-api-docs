name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP 8.4, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --with="illuminate/support:${{ matrix.laravel }}" --prefer-dist --no-interaction

      - name: Pest
        run: composer test
